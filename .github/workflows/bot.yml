name: Iraq News Bot

on:
  # Started every 15 minutes by cron-job.org (or by hand from the Actions tab)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: show posts in the log, do not post or save"
        type: boolean
        default: false

# Never run two copies at the same time
concurrency:
  group: iraq-news-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # to clean up old saved states

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Load saved state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Run bot
        env:
          INOREADER_APP_ID: ${{ secrets.INOREADER_APP_ID }}
          INOREADER_APP_KEY: ${{ secrets.INOREADER_APP_KEY }}
          INOREADER_REFRESH_TOKEN: ${{ secrets.INOREADER_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python3 bot.py

      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: bot-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save renewed Inoreader token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          FILE="$RUNNER_TEMP/new_refresh_token.txt"
          if [ -f "$FILE" ]; then
            if [ -z "$GH_TOKEN" ]; then
              echo "::error::Inoreader renewed its token but secret GH_PAT is missing, so it could not be saved."
              exit 1
            fi
            gh secret set INOREADER_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$FILE"
            rm -f "$FILE"
            echo "Renewed Inoreader token saved to Secrets."
          fi

      - name: Clean up old saved states
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key bot-state- --sort created_at --order desc \
            --limit 100 --json id --jq '.[5:][].id' |
          while read -r id; do
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
          done
