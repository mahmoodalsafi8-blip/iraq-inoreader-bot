name: Iraq News Bot

on:
  # Started every 30 minutes by cron-job.org (or by hand from the Actions tab)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: show posts in the log, do not post or tag"
        type: boolean
        default: false
      lookback_hours:
        description: "How many hours back to look for news"
        type: string
        default: "3"

# Never run two copies at the same time
concurrency:
  group: iraq-news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Run bot
        env:
          INOREADER_APP_ID: ${{ secrets.INOREADER_APP_ID }}
          INOREADER_APP_KEY: ${{ secrets.INOREADER_APP_KEY }}
          INOREADER_REFRESH_TOKEN: ${{ secrets.INOREADER_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '3' }}
        run: python3 bot.py

      - name: Save renewed Inoreader token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          FILE="$RUNNER_TEMP/new_refresh_token.txt"
          if [ -f "$FILE" ]; then
            if [ -z "$GH_TOKEN" ]; then
              echo "::error::Inoreader renewed its token but secret GH_PAT is missing, so it could not be saved."
              exit 1
            fi
            gh secret set INOREADER_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$FILE"
            rm -f "$FILE"
            echo "Renewed Inoreader token saved to Secrets."
          fi
